<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cortex">
<meta name="description" content="Cortex — пространство для глубоких разговоров">
<title>Cortex — знакомства для умных</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%2307080c'/%3E%3Ctext x='256' y='330' text-anchor='middle' font-family='Georgia,serif' font-size='300' font-weight='bold' fill='%238ba3ff'%3EC%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%2307080c'/%3E%3Ctext x='256' y='330' text-anchor='middle' font-family='Georgia,serif' font-size='300' font-weight='bold' fill='%238ba3ff'%3EC%3C/text%3E%3C/svg%3E">
<style>
*,*::before,*::after{box-sizing:border-box}
*{margin:0;padding:0}
:root{
  --bg-0:#07080c;--bg-1:#0c0e13;--panel:rgba(18,21,28,.68);--panel-solid:#12151c;
  --panel-2:rgba(12,14,19,.72);--border:rgba(255,255,255,.07);--border-strong:rgba(255,255,255,.12);
  --border-hi:rgba(139,163,255,.35);--text:#ece9e4;--text-dim:#b6b2ab;--muted:#767b87;
  --accent:#8ba3ff;--accent-2:#c9a3ff;--accent-warm:#f0b79a;--success:#7ee0b0;--danger:#ff8a8a;
  --shadow-soft:0 20px 60px rgba(0,0,0,.55);--shadow-glow:0 12px 40px rgba(139,163,255,.22);
  --r-sm:8px;--r-md:12px;--r-lg:18px;--r-xl:24px;--ease:cubic-bezier(.22,.61,.36,1)
}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Roboto,sans-serif;
  background:var(--bg-0);color:var(--text);line-height:1.55;min-height:100vh;position:relative;
  overflow-x:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(1200px 900px at 8% -10%,rgba(139,163,255,.10),transparent 55%),
    radial-gradient(1000px 800px at 110% 8%,rgba(201,163,255,.09),transparent 55%),
    radial-gradient(900px 900px at 50% 118%,rgba(240,183,154,.06),transparent 60%),
    linear-gradient(180deg,var(--bg-0),var(--bg-1))}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.045;
  mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  background-size:240px 240px}
#root{position:relative;z-index:1}
button,input,textarea,select{font-family:inherit}
button{cursor:pointer}
img{display:block;max-width:100%}

/* LAYOUT */
.app-shell{display:flex;min-height:100vh}
.sidebar{width:248px;padding:26px 16px;display:flex;flex-direction:column;gap:4px;
  position:sticky;top:0;height:100vh;
  background:linear-gradient(180deg,rgba(18,21,28,.86),rgba(9,11,16,.86));
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-right:1px solid var(--border)}
.logo{font-family:Georgia,'Times New Roman',serif;font-size:27px;font-weight:700;letter-spacing:-.3px;
  padding:0 10px 26px;background:linear-gradient(120deg,var(--accent) 0%,var(--accent-2) 60%,var(--accent-warm) 120%);
  background-size:200% 100%;-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;animation:shimmer 8s ease-in-out infinite}
@keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.nav-btn{display:flex;align-items:center;gap:12px;padding:11px 14px;background:transparent;
  border:1px solid transparent;border-radius:var(--r-md);color:var(--muted);font-size:14.5px;
  text-align:left;transition:all .18s var(--ease);position:relative}
.nav-btn svg{flex-shrink:0;opacity:.85}
.nav-btn:hover{background:rgba(255,255,255,.03);color:var(--text-dim)}
.nav-btn.active{background:linear-gradient(90deg,rgba(139,163,255,.14),rgba(201,163,255,.05));
  border-color:rgba(139,163,255,.22);color:var(--text);box-shadow:0 0 0 1px rgba(139,163,255,.06) inset}
.nav-btn.active::before{content:'';position:absolute;left:-1px;top:10px;bottom:10px;width:2px;
  border-radius:2px;background:linear-gradient(180deg,var(--accent),var(--accent-2))}
.nav-btn .badge{margin-left:auto;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#0a0b10;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}
.sidebar-footer{margin-top:auto;padding:16px 8px 4px;border-top:1px solid var(--border);
  font-size:13px;color:var(--muted)}
.main{flex:1;padding:40px 48px;max-width:920px}

/* AUTH */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-card{width:100%;max-width:520px;padding:44px 40px;background:var(--panel);
  backdrop-filter:blur(26px) saturate(1.2);-webkit-backdrop-filter:blur(26px) saturate(1.2);
  border:1px solid var(--border);border-radius:var(--r-xl);
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(139,163,255,.04);
  animation:cardIn .5s var(--ease)}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.auth-card h1{font-family:Georgia,serif;font-size:38px;font-weight:700;letter-spacing:-.5px;
  margin-bottom:8px;background:linear-gradient(120deg,var(--accent),var(--accent-2));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.auth-card .sub{color:var(--muted);font-size:14.5px;margin-bottom:30px}
.tabs{display:flex;gap:4px;padding:4px;margin-bottom:26px;background:rgba(0,0,0,.35);
  border:1px solid var(--border);border-radius:11px}
.tabs button{flex:1;padding:10px;background:transparent;border:none;border-radius:8px;
  color:var(--muted);font-size:14px;font-weight:500;transition:all .18s}
.tabs button.active{background:rgba(139,163,255,.12);color:var(--text);
  box-shadow:0 0 0 1px rgba(139,163,255,.18) inset}

/* FORMS */
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:7px;letter-spacing:.3px;
  text-transform:uppercase;font-weight:500}
input,textarea,select{width:100%;padding:12px 14px;background:rgba(6,8,12,.65);
  border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text);font-size:15px;
  margin-bottom:18px;transition:all .15s;outline:none}
input::placeholder,textarea::placeholder{color:rgba(118,123,135,.65)}
input:focus,textarea:focus,select:focus{border-color:var(--border-hi);
  box-shadow:0 0 0 3px rgba(139,163,255,.12);background:rgba(6,8,12,.85)}
textarea{resize:vertical;min-height:82px;line-height:1.5}
select{appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23767b87' stroke-width='2' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;background-size:16px;
  padding-right:40px;cursor:pointer}
select option{background:#14171e;color:var(--text)}
.btn{width:100%;padding:13px 18px;background:linear-gradient(120deg,var(--accent),var(--accent-2));
  border:none;border-radius:var(--r-sm);color:#0a0b10;font-size:15px;font-weight:600;
  transition:all .2s var(--ease);box-shadow:var(--shadow-glow)}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 16px 44px rgba(139,163,255,.32)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text-dim);
  font-weight:500;box-shadow:none}
.btn.ghost:hover{border-color:var(--border-hi);color:var(--text);background:rgba(255,255,255,.02)}
.btn.small{width:auto;padding:8px 16px;font-size:13.5px}
.error{color:var(--danger);font-size:13px;margin-bottom:14px;min-height:18px}
.hint{color:var(--muted);font-size:12.5px;text-align:center;margin-top:16px}

/* TEST */
.progress{height:3px;background:rgba(255,255,255,.05);border-radius:3px;margin-bottom:26px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));
  width:0;transition:width .5s var(--ease);box-shadow:0 0 12px rgba(139,163,255,.5)}
.diff-badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:20px;
  margin-bottom:14px;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.diff-easy{background:rgba(126,224,176,.10);color:var(--success)}
.diff-medium{background:rgba(139,163,255,.12);color:var(--accent)}
.diff-hard{background:rgba(255,138,138,.12);color:var(--danger)}
.question{padding:24px;background:rgba(6,8,12,.5);border:1px solid var(--border);
  border-radius:var(--r-md);margin-bottom:22px}
.question p.q-text{font-family:Georgia,serif;font-size:16.5px;margin-bottom:18px;line-height:1.55}
.opt{display:flex;align-items:center;gap:12px;padding:13px 15px;background:rgba(18,21,28,.5);
  border:1px solid var(--border);border-radius:var(--r-sm);margin-bottom:8px;cursor:pointer;
  font-size:14.5px;transition:all .15s}
.opt:hover{border-color:var(--border-hi);background:rgba(139,163,255,.04)}
.opt input{width:auto;margin:0;accent-color:var(--accent)}
.opt.selected{border-color:var(--border-hi);background:rgba(139,163,255,.08);
  box-shadow:0 0 0 1px rgba(139,163,255,.15) inset}

/* PROFILE CARD */
.profile-card{padding:36px 32px;max-width:560px;margin:0 auto;background:var(--panel);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--border);
  border-radius:var(--r-xl);text-align:center;
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 30px 80px rgba(0,0,0,.5);
  animation:cardIn .45s var(--ease)}
.avatar{width:104px;height:104px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;margin:0 auto 18px;font-family:Georgia,serif;font-size:40px;
  font-weight:700;color:#0a0b10;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 0 0 4px rgba(139,163,255,.08),0 12px 40px rgba(139,163,255,.28);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.profile-card h2{font-family:Georgia,serif;font-size:26px;font-weight:700;margin-bottom:6px;
  letter-spacing:-.2px;display:flex;align-items:center;justify-content:center;gap:6px}
.profile-card .meta{color:var(--muted);font-size:13.5px;margin-bottom:18px}
.profile-card .bio{color:var(--text-dim);font-size:15px;line-height:1.65;margin-bottom:22px}
.match-score{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;
  background:rgba(126,224,176,.09);color:var(--success);border:1px solid rgba(126,224,176,.18);
  border-radius:20px;font-size:13px;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:22px}
.tag{padding:5px 12px;background:rgba(139,163,255,.08);border:1px solid rgba(139,163,255,.14);
  border-radius:20px;font-size:12px;color:var(--accent)}
.actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.actions .btn{flex:1;min-width:120px}
.btn.pass{background:transparent;border:1px solid var(--border);color:var(--muted);box-shadow:none}
.btn.pass:hover{border-color:rgba(255,138,138,.4);color:var(--danger);background:rgba(255,138,138,.05)}
.btn.like{background:linear-gradient(120deg,#f0b79a,#ff8a9a);box-shadow:0 12px 40px rgba(240,183,154,.25)}
.btn.like:hover{box-shadow:0 16px 44px rgba(240,183,154,.35)}
.stats{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;margin-top:20px;
  font-size:13px;color:var(--muted)}
.stats b{color:var(--text);font-weight:600}

/* PHOTOS */
.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}
.photo-slot{aspect-ratio:1;border-radius:var(--r-md);border:1.5px dashed var(--border-strong);
  display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
  background:rgba(6,8,12,.4);color:var(--muted);cursor:pointer;transition:all .18s}
.photo-slot:hover{border-color:var(--border-hi);color:var(--accent);background:rgba(139,163,255,.04)}
.photo-slot.filled{border-style:solid;border-color:transparent}
.photo-slot img{width:100%;height:100%;object-fit:cover}
.photo-slot .remove{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;
  background:rgba(0,0,0,.72);backdrop-filter:blur(6px);color:#fff;
  border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .15s}
.photo-slot:hover .remove{opacity:1}
.gallery-view{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:22px}
.gallery-view .photo{aspect-ratio:1;border-radius:var(--r-md);object-fit:cover;width:100%;
  border:1px solid var(--border)}
.gallery-view .photo.single{grid-column:1/-1;aspect-ratio:16/10}

/* LISTS */
.page-title{font-family:Georgia,serif;font-size:30px;font-weight:700;margin-bottom:8px;
  letter-spacing:-.3px}
.page-sub{color:var(--muted);font-size:14px;margin-bottom:30px}
.list{display:flex;flex-direction:column;gap:10px}
.list-item{display:flex;align-items:center;gap:16px;padding:15px 18px;
  background:rgba(18,21,28,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--border);border-radius:var(--r-md);cursor:pointer;
  transition:all .18s var(--ease)}
.list-item:hover{border-color:var(--border-hi);background:rgba(139,163,255,.05);
  transform:translateY(-1px);box-shadow:0 12px 32px rgba(0,0,0,.35)}
.avatar-sm{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-family:Georgia,serif;font-size:20px;font-weight:700;color:#0a0b10;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));flex-shrink:0;overflow:hidden;
  box-shadow:0 0 0 2px rgba(139,163,255,.08)}
.avatar-sm img{width:100%;height:100%;object-fit:cover}
.list-item .info{flex:1;min-width:0}
.list-item .info h4{font-size:15px;font-weight:600;margin-bottom:3px;display:flex;
  align-items:center;gap:6px}
.list-item .info p{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.list-item .info .loc{font-size:12px;color:var(--muted);opacity:.75;margin-top:3px}
.list-item .score-badge{font-size:12.5px;color:var(--success);font-weight:600;padding:4px 10px;
  background:rgba(126,224,176,.08);border-radius:20px;flex-shrink:0}

/* CHAT */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 80px);min-height:520px;
  background:var(--panel);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.5)}
.chat-header{display:flex;align-items:center;gap:12px;padding:14px 18px;
  border-bottom:1px solid var(--border);background:rgba(9,11,16,.5)}
.chat-header h3{font-size:15.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.chat-header .back,.chat-header .icon-btn{background:transparent;border:1px solid transparent;
  color:var(--muted);width:36px;height:36px;border-radius:8px;display:inline-flex;
  align-items:center;justify-content:center;transition:all .15s}
.chat-header .back:hover,.chat-header .icon-btn:hover{border-color:var(--border);color:var(--text);
  background:rgba(255,255,255,.03)}
.chat-actions{margin-left:auto;display:flex;gap:6px;position:relative}
.messages{flex:1;overflow-y:auto;padding:22px 20px;display:flex;flex-direction:column;gap:10px}
.messages::-webkit-scrollbar{width:8px}
.messages::-webkit-scrollbar-thumb{background:rgba(255,255,255,.06);border-radius:4px}
.msg{max-width:72%;padding:11px 15px;border-radius:16px;font-size:14.5px;line-height:1.45;
  word-wrap:break-word;animation:msgIn .25s var(--ease)}
@keyframes msgIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#0a0b10;border-bottom-right-radius:5px;box-shadow:0 6px 20px rgba(139,163,255,.18)}
.msg.them{align-self:flex-start;background:rgba(255,255,255,.04);color:var(--text);
  border:1px solid var(--border);border-bottom-left-radius:5px}
.msg .time{display:block;font-size:10.5px;opacity:.55;margin-top:4px}
.chat-input{display:flex;align-items:center;gap:8px;padding:12px 14px;
  border-top:1px solid var(--border);background:rgba(9,11,16,.55)}
.chat-input input{flex:1;margin:0;border-radius:20px;padding:11px 16px}
.btn.send{width:auto;padding:0;height:42px;min-width:42px;border-radius:50%;display:inline-flex;
  align-items:center;justify-content:center}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;
  border-radius:50%;background:transparent;border:1px solid var(--border);color:var(--muted);
  transition:all .18s;position:relative}
.icon-btn:hover{border-color:var(--border-hi);color:var(--text)}
.icon-btn.recording{background:rgba(255,138,138,.12);border-color:rgba(255,138,138,.4);
  color:var(--danger);animation:pulse 1.4s ease-in-out infinite}
.icon-btn.recording::after{content:attr(data-timer);position:absolute;top:-30px;left:50%;
  transform:translateX(-50%);background:var(--panel-solid);border:1px solid var(--danger);
  color:var(--danger);font-size:11px;padding:3px 8px;border-radius:20px;white-space:nowrap;
  font-variant-numeric:tabular-nums}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.chat-empty{text-align:center;color:var(--muted);font-size:13.5px;padding:30px 20px}

/* VOICE */
.voice{display:flex;align-items:center;gap:10px;min-width:210px}
.voice-btn{width:34px;height:34px;border-radius:50%;border:none;display:inline-flex;
  align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .15s}
.msg.me .voice-btn{background:rgba(10,11,16,.25);color:#0a0b10}
.msg.me .voice-btn:hover{background:rgba(10,11,16,.4)}
.msg.them .voice-btn{background:rgba(139,163,255,.14);color:var(--accent)}
.msg.them .voice-btn:hover{background:rgba(139,163,255,.24)}
.voice-track{flex:1;height:3px;border-radius:2px;overflow:hidden;position:relative}
.msg.me .voice-track{background:rgba(10,11,16,.25)}
.msg.them .voice-track{background:rgba(139,163,255,.18)}
.voice-progress{height:100%;width:0;transition:width .1s linear}
.msg.me .voice-progress{background:#0a0b10}
.msg.them .voice-progress{background:var(--accent)}
.voice-dur{font-size:11px;opacity:.8;min-width:34px;text-align:right;
  font-variant-numeric:tabular-nums}

/* MODALS */
.modal-backdrop{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.72);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;
  justify-content:center;padding:20px;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:440px;background:var(--panel-solid);border:1px solid var(--border-strong);
  border-radius:var(--r-lg);padding:28px;box-shadow:0 40px 100px rgba(0,0,0,.7);
  animation:cardIn .3s var(--ease)}
.modal h3{font-family:Georgia,serif;font-size:20px;margin-bottom:8px}
.modal .modal-sub{color:var(--muted);font-size:13.5px;margin-bottom:18px;line-height:1.55}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.modal-actions .btn{flex:1}
.modal .btn.danger{background:linear-gradient(120deg,#ff8a8a,#ff6b6b);color:#fff;
  box-shadow:0 12px 40px rgba(255,138,138,.25)}
.menu{position:absolute;top:calc(100% + 6px);right:0;min-width:180px;background:var(--panel-solid);
  border:1px solid var(--border-strong);border-radius:var(--r-md);padding:6px;
  box-shadow:0 24px 60px rgba(0,0,0,.6);z-index:500;animation:cardIn .18s var(--ease)}

    clearInterval(this.timer); this.timer = null;
    if (this.stream) { this.stream.getTracks().forEach(t => t.stop()); this.stream = null; }
    this.chunks = [];
  }
}
function voicePlayerHTML(id, dataUrl, duration) {

  return `<div class="voice">
    <button type="button" class="voice-btn" data-play="${safeId}" aria-label="Воспроизвести">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg>
    </button>
    <div class="voice-track"><div class="voice-progress" data-progress="${safeId}"></div></div>
    <span class="voice-dur">${fmtDuration(duration || 0)}</span>
    <audio preload="metadata" src="${dataUrl}" data-audio="${safeId}"></audio>
  </div>`;

function bindVoicePlayers(root = document) {
  root.querySelectorAll('[data-play]').forEach(btn => {
    const id = btn.dataset.play;
    if (!id) return;
    const audio = root.querySelector(`[data-audio="${id}"]`);
    const bar = root.querySelector(`[data-progress="${id}"]`);
    if (!audio || !bar || btn._bound) return;
    btn._bound = true;
    btn.onclick = (e) => {
      e.stopPropagation();
      root.querySelectorAll('audio').forEach(a => {
        if (a !== audio && !a.paused) { a.pause(); a.currentTime = 0; }
      });
      if (audio.paused) { const p = audio.play(); if (p?.catch) p.catch(() => {}); }
      else audio.pause();
    };
    audio.ontimeupdate = () => {
      const d = audio.duration;
      if (!d || isNaN(d) || !isFinite(d)) return;
      bar.style.width = ((audio.currentTime / d) * 100) + '%';
    };
    audio.onplay  = () => btn.classList.add('playing');
    audio.onpause = () => btn.classList.remove('playing');
    audio.onended = () => { btn.classList.remove('playing'); bar.style.width = '0%'; };
  });
}

async function initNotifications() {
  if (!CONFIG.features.notifications) return;
  if (!('serviceWorker' in navigator) || !('Notification' in window)) return;
  const vapid = CONFIG.firebase.vapidKey;
  if (!vapid || vapid === 'YOUR_WEB_PUSH_VAPID_KEY') return;
  try {
    const { getApps, initializeApp } = await import('https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js');
    const { getMessaging, onMessage } = await import('https://www.gstatic.com/firebasejs/10.7.0/firebase-messaging.js');
    const app = getApps()[0] || initializeApp(CONFIG.firebase);
    messaging = getMessaging(app);
    onMessage(messaging, payload => {
      const t = payload.notification?.title || 'Cortex';
      const b = payload.notification?.body || '';
      showToast(`${t}: ${b}`);
    });
  } catch (e) { console.warn('[Cortex] FCM недоступен:', e); }
}
async function requestPushPermission(userId, saveTokenFn) {
  if (!messaging) return { ok:false, reason:'Push не настроен' };
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') return { ok:false, reason:'Разрешение не выдано' };
  try {
    const { getToken } = await import('https://www.gstatic.com/firebasejs/10.7.0/firebase-messaging.js');
    const token = await getToken(messaging, { vapidKey: CONFIG.firebase.vapidKey });
    if (token && saveTokenFn) await saveTokenFn(userId, token);
    return { ok:true, token };
  } catch (e) { return { ok:false, reason:e.message }; }
}

/* ============ DB.LOCAL ============ */
const LS_KEY = {
  users:'cortex_users', session:'cortex_session', likes:'cortex_likes',
  passed:'cortex_passed', chats:'cortex_chats', blocks:'cortex_blocks',
  reports:'cortex_reports', verifications:'cortex_verifications', tokens:'cortex_push_tokens'
};
const lsRead  = (k, f) => { try { return JSON.parse(localStorage.getItem(k)) ?? f; } catch { return f; } };
const lsWrite = (k, v) => localStorage.setItem(k, JSON.stringify(v));

class LocalDB {
  constructor() { this._h = []; this._bind(); }
  _bind() {
    window.addEventListener('storage', e => {
      if (e.key && e.key.startsWith('cortex_')) this._emit();
    });
  }
  _emit() { this._h.forEach(fn => { try { fn(); } catch {} }); }
  onDataChange(fn) { this._h.push(fn); }
  offDataChange(fn) { this._h = this._h.filter(f => f !== fn); }

  _allUsers() { return lsRead(LS_KEY.users, {}); }
  async createUser(data) {
    const users = this._allUsers();
    const id = uid();
    users[id] = {
      id, name: data.name, age: parseInt(data.age), bio: data.bio,
      interests: data.interests || [], photos: data.photos || [],
      country: data.country || '', city: data.city || '',
      passHash: hash(data.password),
      score: data.score || 0, scoreTotal: data.scoreTotal || 0,
      verified: false, createdAt: Date.now()
    };
    lsWrite(LS_KEY.users, users); this._emit(); return id;
  }
  async getUser(id) { return this._allUsers()[id] || null; }
  async findUserByName(name) {
    return Object.values(this._allUsers())
      .find(u => u.name.toLowerCase() === name.toLowerCase()) || null;
  }
  async listUsers() { return Object.values(this._allUsers()); }
  async updateUser(id, patch) {
    const users = this._allUsers();
    if (!users[id]) return;
    users[id] = { ...users[id], ...patch };
    lsWrite(LS_KEY.users, users); this._emit();
  }

  async likeUser(from, to) {
    const likes = lsRead(LS_KEY.likes, {});
    likes[from] = [...new Set([...(likes[from] || []), to])];
    lsWrite(LS_KEY.likes, likes); this._emit();
    return (likes[to] || []).includes(from);
  }
  async passUser(from, to) {
    const p = lsRead(LS_KEY.passed, {});
    p[from] = [...new Set([...(p[from] || []), to])];
    lsWrite(LS_KEY.passed, p); this._emit();
  }
  async isPassed(from, to) { return (lsRead(LS_KEY.passed, {})[from] || []).includes(to); }
  async getLikes(userId) { return lsRead(LS_KEY.likes, {})[userId] || []; }
  async getMutualMatches(userId) {
    const likes = lsRead(LS_KEY.likes, {});
    const mine = likes[userId] || [];
    const blocks = lsRead(LS_KEY.blocks, {});
    return mine.filter(id =>
      (likes[id] || []).includes(userId) &&
      !((blocks[userId] || []).includes(id)) &&
      !((blocks[id] || []).includes(userId))
    );
  }

  async blockUser(from, to) {
    const b = lsRead(LS_KEY.blocks, {});
    b[from] = [...new Set([...(b[from] || []), to])];
    lsWrite(LS_KEY.blocks, b);
    const likes = lsRead(LS_KEY.likes, {});
    if (likes[from]) likes[from] = likes[from].filter(x => x !== to);
    if (likes[to])   likes[to]   = likes[to].filter(x => x !== from);
    lsWrite(LS_KEY.likes, likes); this._emit();
  }
  async unblockUser(from, to) {
    const b = lsRead(LS_KEY.blocks, {});
    b[from] = (b[from] || []).filter(x => x !== to);
    lsWrite(LS_KEY.blocks, b); this._emit();
  }
  async isBlocked(a, b) {
    const bl = lsRead(LS_KEY.blocks, {});
    return (bl[a] || []).includes(b) || (bl[b] || []).includes(a);
  }
  async listBlocked(userId) { return lsRead(LS_KEY.blocks, {})[userId] || []; }

  _ck(a, b) { return [a, b].sort().join('__'); }
  async sendMessage(from, to, payload) {
    if (await this.isBlocked(from, to)) throw new Error('Пользователь заблокирован');
    const chats = lsRead(LS_KEY.chats, {});
    const k = this._ck(from, to);
    if (!chats[k]) chats[k] = [];
    const msg = typeof payload === 'string'
      ? { from, text: payload, ts: Date.now(), type: 'text' }
      : { from, ts: Date.now(), ...payload };
    chats[k].push(msg);
    lsWrite(LS_KEY.chats, chats); this._emit();
  }
  async getMessages(a, b) { return lsRead(LS_KEY.chats, {})[this._ck(a, b)] || []; }

  async createReport(report) {
    const list = lsRead(LS_KEY.reports, []);
    const entry = { id: uid(), ts: Date.now(), status: 'open', ...report };
    list.push(entry);
    lsWrite(LS_KEY.reports, list); this._emit();
    return entry.id;
  }
  async listReports() { return lsRead(LS_KEY.reports, []); }

  async createVerification(v) {
    const list = lsRead(LS_KEY.verifications, []);
    const entry = { id: uid(), ...v };
    list.push(entry);
    lsWrite(LS_KEY.verifications, list); this._emit();
    return entry.id;
  }
  async getVerification(id) {
    return lsRead(LS_KEY.verifications, []).find(v => v.id === id) || null;
  }
  async updateVerification(id, patch) {
    const list = lsRead(LS_KEY.verifications, []);
    const i = list.findIndex(v => v.id === id);
    if (i < 0) return;
    list[i] = { ...list[i], ...patch };
    lsWrite(LS_KEY.verifications, list); this._emit();
  }
  async listVerifications() { return lsRead(LS_KEY.verifications, []); }

  async savePushToken(userId, token) {
    const t = lsRead(LS_KEY.tokens, {});
    t[userId] = token;
    lsWrite(LS_KEY.tokens, t);
  }

  async getSession() { return lsRead(LS_KEY.session, null); }
  async setSession(id) { lsWrite(LS_KEY.session, id); this._emit(); }
  async clearSession() { localStorage.removeItem(LS_KEY.session); this._emit(); }
}

/* ============ DB.FIREBASE ============ */
async function createFirebaseDB(cfg) {
  const [{ initializeApp }, authMod, dbMod] = await Promise.all([
    import('https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js'),
    import('https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js'),
    import('https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js')
  ]);
  const { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } = authMod;
  const { getDatabase, ref, set, get, update, push, onValue, query, orderByChild, equalTo } = dbMod;

  const app = initializeApp(cfg);
  const auth = getAuth(app);
  const db = getDatabase(app);
  const hashStr = s => { let h = 0; for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0; return h; };
  const emailFromName = n => `${n.toLowerCase().replace(/[^a-z0-9]/g,'')}_${Math.abs(hashStr(n))}@cortex.local`;

  class FirebaseDB {
    constructor() { this._h = []; }
    onDataChange(fn) { this._h.push(fn); }
    offDataChange(fn) { this._h = this._h.filter(f => f !== fn); }
    _emit() { this._h.forEach(fn => { try { fn(); } catch {} }); }
    _subscribeAll() {
      ['users','likes','passed','chats','blocks','reports','verifications']
        .forEach(b => onValue(ref(db, b), () => this._emit()));
    }
    async createUser(data) {
      const email = emailFromName(data.name);
      const cred = await createUserWithEmailAndPassword(auth, email, data.password);
      const id = cred.user.uid;
      await set(ref(db, `users/${id}`), {
        id, name: data.name, age: parseInt(data.age), bio: data.bio,
        interests: data.interests || [], photos: data.photos || [],
        country: data.country || '', city: data.city || '', email,
        score: data.score || 0, scoreTotal: data.scoreTotal || 0,
        verified: false, createdAt: Date.now()
      });
      return id;
    }
    async getUser(id) { const s = await get(ref(db, `users/${id}`)); return s.exists() ? s.val() : null; }
    async findUserByName(name) {
      const s = await get(query(ref(db, 'users'), orderByChild('name'), equalTo(name)));
      return s.exists() ? Object.values(s.val())[0] : null;
    }
    async listUsers() {
      const s = await get(ref(db, 'users'));
      return s.exists() ? Object.values(s.val()) : [];
    }
    async updateUser(id, patch) { await update(ref(db, `users/${id}`), patch); }

    async likeUser(from, to) {
      await set(ref(db, `likes/${from}/${to}`), true);
      const s = await get(ref(db, `likes/${to}/${from}`));
      return s.exists();
    }
    async passUser(from, to) { await set(ref(db, `passed/${from}/${to}`), true); }
    async isPassed(from, to) { const s = await get(ref(db, `passed/${from}/${to}`)); return s.exists(); }
    async getLikes(userId) {
      const s = await get(ref(db, `likes/${userId}`));
      return s.exists() ? Object.keys(s.val()) : [];
    }
    async getMutualMatches(userId) {
      const [my, all, blocksSnap] = await Promise.all([
        get(ref(db, `likes/${userId}`)),
        get(ref(db, 'likes')),
        get(ref(db, 'blocks'))
      ]);
      if (!my.exists()) return [];
      const allV = all.val() || {};
      const blocks = blocksSnap.val() || {};
      return Object.keys(my.val()).filter(id =>
        allV[id] && allV[id][userId] &&
        !(blocks[userId]?.[id]) && !(blocks[id]?.[userId])
      );
    }

    async blockUser(from, to) {
      await set(ref(db, `blocks/${from}/${to}`), true);
      await set(ref(db, `likes/${from}/${to}`), null);
      await set(ref(db, `likes/${to}/${from}`), null);
    }
    async unblockUser(from, to) { await set(ref(db, `blocks/${from}/${to}`), null); }
    async isBlocked(a, b) {
      const [s1, s2] = await Promise.all([
        get(ref(db, `blocks/${a}/${b}`)),
        get(ref(db, `blocks/${b}/${a}`))
      ]);
      return s1.exists() || s2.exists();
    }
    async listBlocked(userId) {
      const s = await get(ref(db, `blocks/${userId}`));
      return s.exists() ? Object.keys(s.val()) : [];
    }

    _ck(a, b) { return [a, b].sort().join('__'); }
    async sendMessage(from, to, payload) {
      if (await this.isBlocked(from, to)) throw new Error('Пользователь заблокирован');
      const k = this._ck(from, to);
      const msg = typeof payload === 'string'
        ? { from, text: payload, ts: Date.now(), type: 'text' }
        : { from, ts: Date.now(), ...payload };
      await push(ref(db, `chats/${k}`), msg);
    }
    async getMessages(a, b) {
      const s = await get(ref(db, `chats/${this._ck(a, b)}`));
      if (!s.exists()) return [];
      return Object.values(s.val()).sort((x, y) => x.ts - y.ts);
    }

    async createReport(r) {
      const id = uid();
      await set(ref(db, `reports/${id}`), { id, ts: Date.now(), status: 'open', ...r });
      return id;
    }
    async listReports() {
      const s = await get(ref(db, 'reports'));
      return s.exists() ? Object.values(s.val()) : [];
    }

    async createVerification(v) {
      const id = uid();
      await set(ref(db, `verifications/${id}`), { id, ...v });
      return id;
    }
    async getVerification(id) { const s = await get(ref(db, `verifications/${id}`)); return s.exists() ? s.val() : null; }
    async updateVerification(id, patch) { await update(ref(db, `verifications/${id}`), patch); }
    async listVerifications() {
      const s = await get(ref(db, 'verifications'));
      return s.exists() ? Object.values(s.val()) : [];
    }

    async savePushToken(userId, token) { await set(ref(db, `push_tokens/${userId}`), token); }

    async getSession() {
      return new Promise(res => {
        const unsub = onAuthStateChanged(auth, u => { unsub(); res(u ? u.uid : null); });
      });
    }
    async setSession() {}
    async clearSession() { await signOut(auth); this._emit(); }
  }

  const instance = new FirebaseDB();
  onAuthStateChanged(auth, () => instance._emit());
  instance._subscribeAll();
  return instance;
}

  if (!cities.length) return `<option value="">—</option>`;
  return cities.map(c =>
    `<option value="${esc(c)}" ${sel === c ? 'selected' : ''}>${esc(c)}</option>`).join('');
}

/* ============ MODALS ============ */
function openReportModal(profileName) {
  return new Promise(resolve => {
    const el = document.createElement('div');
    el.className = 'modal-backdrop';
    el.innerHTML = `
      <div class="modal">
        <h3>Жалоба на ${esc(profileName)}</h3>
        <p class="modal-sub">Опишите причину. Модератор рассмотрит жалобу в течение 24 часов.</p>
        <textarea id="report-reason" rows="4" placeholder="Спам, оскорбления, фейковый профиль..."></textarea>
        <div class="modal-actions">
          <button type="button" class="btn ghost" data-cancel>Отмена</button>
          <button type="button" class="btn danger" data-send>Отправить</button>
        </div>
      </div>`;
    document.body.appendChild(el);
    const close = v => { el.remove(); resolve(v); };
    el.querySelector('[data-cancel]').onclick = () => close(null);
    el.querySelector('[data-send]').onclick = () => {
      const v = el.querySelector('#report-reason').value.trim();
      if (v.length < 5) { showToast('Опишите причину подробнее'); return; }
      close(v.slice(0, 300));
    };
    el.addEventListener('click', e => { if (e.target === el) close(null); });
  });
}
function openConfirmModal({ title, text, confirmLabel = 'Подтвердить', danger = false }) {
  return new Promise(resolve => {
    const el = document.createElement('div');
    el.className = 'modal-backdrop';
    el.innerHTML = `
      <div class="modal">
        <h3>${esc(title)}</h3>
        <p class="modal-sub">${esc(text)}</p>
        <div class="modal-actions">
          <button type="button" class="btn ghost" data-cancel>Отмена</button>
          <button type="button" class="btn ${danger ? 'danger' : ''}" data-ok>${esc(confirmLabel)}</button>
        </div>
      </div>`;
    document.body.appendChild(el);
    const close = v => { el.remove(); resolve(v); };
    el.querySelector('[data-cancel]').onclick = () => close(false);
    el.querySelector('[data-ok]').onclick = () => close(true);
    el.addEventListener('click', e => { if (e.target === el) close(false); });
  });
}

/* ============ RENDER ROOT ============ */
async function render() {
  const sid = await DB.getSession();
  const user = sid ? await DB.getUser(sid) : null;
  if (user) state.userId = user.id;

  const root = $('#root');
  if (!user) { root.innerHTML = renderAuth(); bindAuth(); }
  else if (state.view === 'test') { root.innerHTML = renderTest(); bindTest(); }
  else { root.innerHTML = await renderApp(user); bindApp(user); }
}

/* ============ AUTH ============ */
function renderAuth() {
  const t = state.authTab;
  return `
    <div class="auth-wrap">
      <div class="auth-card">
        <h1>Cortex</h1>
        <p class="sub">Пространство для глубоких разговоров. Не для всех.</p>
        <div class="tabs">
          <button type="button" data-tab="login" class="${t === 'login' ? 'active' : ''}">Вход</button>
          <button type="button" data-tab="register" class="${t === 'register' ? 'active' : ''}">Регистрация</button>
        </div>
        ${t === 'login' ? renderLogin() : renderRegister()}
      </div>
    </div>`;
}
function renderLogin() {
  return `
    <div class="error" id="auth-error"></div>
    <label>Имя</label>
    <input id="l-name" placeholder="Как при регистрации" autocomplete="username">
    <label>Пароль</label>
    <input id="l-pass" type="password" placeholder="Минимум 4 символа" autocomplete="current-password">
    <button type="button" class="btn" id="do-login">Войти</button>
    <p class="hint">Нет аккаунта? Перейдите на вкладку «Регистрация».</p>`;
}
function renderRegister() {
  return `
    <div class="error" id="auth-error"></div>
    <label>Имя или псевдоним</label>
    <input id="r-name" placeholder="Алекс" autocomplete="off">
    <label>Возраст</label>
    <input id="r-age" type="number" placeholder="28" min="18" max="99">
    <label>Пароль</label>
    <input id="r-pass" type="password" placeholder="Минимум 4 символа" autocomplete="new-password">
    <label>Страна</label>
    <select id="r-country">${countryOptions(state.regCountry)}</select>
    <label>Город</label>
    <select id="r-city">${cityOptions(state.regCountry, state.regCity)}</select>
    <label>О себе</label>
    <textarea id="r-bio" rows="3" placeholder="Читаю нон-фикшн, спорю с Борхесом..."></textarea>
    <label>Интересы (через запятую)</label>
    <input id="r-interests" placeholder="философия, нейробиология, джаз" autocomplete="off">
    <label>Фото (до ${CONFIG.app.maxPhotos})</label>
    ${photoSlotsHTML(state.regPhotos)}
    <input type="file" id="photo-input" accept="image/*" style="display:none">
    <button type="button" class="btn" id="do-register">Пройти вступительный тест</button>
    <p class="hint">Тест занимает около 3 минут и отсеивает случайных людей.</p>`;
}
function bindPhotoSlots() {
  const grid = document.querySelector('.photo-grid');
  if (!grid) return;
  const fileInput = $('#photo-input');
  grid.querySelectorAll('[data-add]').forEach(el => {
    el.onclick = () => fileInput?.click();
  });
  grid.querySelectorAll('[data-remove]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const idx = parseInt(el.dataset.remove);
      state.regPhotos.splice(idx, 1);
      refreshPhotoSlots();
    };
  });
}
function refreshPhotoSlots() {
  const grid = document.querySelector('.photo-grid');
  if (!grid) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = photoSlotsHTML(state.regPhotos);
  grid.parentNode.replaceChild(tmp.firstElementChild, grid);
  bindPhotoSlots();
}
function bindAuth() {
  $$('[data-tab]').forEach(b => b.onclick = () => {
    state.authTab = b.dataset.tab;
    render();
  });

  const btnLogin = $('#do-login');
  if (btnLogin) btnLogin.onclick = async () => {
    const name = $('#l-name').value.trim();
    const pass = $('#l-pass').value;
    const err = $('#auth-error');
    if (!name || !pass) { err.textContent = 'Заполните все поля.'; return; }
    try {
      const user = await DB.findUserByName(name);
      if (!user) { err.textContent = 'Пользователь не найден'; return; }
      if (DB.mode === 'local') {
        if (user.passHash !== hash(pass)) { err.textContent = 'Неверный пароль'; return; }
        await DB.setSession(user.id);
      } else {
        const { getApps } = await import('https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js');
        const { getAuth, signInWithEmailAndPassword } = await import('https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js');
        try {
          await signInWithEmailAndPassword(getAuth(getApps()[0]), user.email, pass);
        } catch { err.textContent = 'Неверный пароль'; return; }
      }
      track('login');
      state.view = 'app';
      await render();
    } catch (e) { err.textContent = 'Ошибка входа: ' + e.message; }
  };

  const countrySel = $('#r-country');
  if (countrySel) {
    if (!state.regCountry) {
      state.regCountry = COUNTRIES[0].code;
      countrySel.value = state.regCountry;
      const citySel = $('#r-city');
      if (citySel) citySel.innerHTML = cityOptions(state.regCountry, '');
    }
    countrySel.onchange = () => {
      state.regCountry = countrySel.value;
      state.regCity = '';
      const citySel = $('#r-city');
      if (citySel) citySel.innerHTML = cityOptions(state.regCountry, '');
    };
  }

  const fileInput = $('#photo-input');
  if (fileInput) {
    fileInput.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const dataUrl = await compressImage(file);
        if (state.regPhotos.length < CONFIG.app.maxPhotos) state.regPhotos.push(dataUrl);
        else showToast('Достигнут лимит фото');
        fileInput.value = '';
        refreshPhotoSlots();
      } catch (err) { showToast('Ошибка загрузки: ' + err.message); }
    };
    bindPhotoSlots();
  }

  const btnReg = $('#do-register');
  if (btnReg) btnReg.onclick = async () => {
    const name = $('#r-name').value.trim();
    const age = $('#r-age').value.trim();
    const pass = $('#r-pass').value;
    const bio = $('#r-bio').value.trim();
    const interests = $('#r-interests').value.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
    const country = $('#r-country').value;
    const city = $('#r-city').value;
    const err = $('#auth-error');

    if (!name || !age || !pass || !bio) { err.textContent = 'Заполните все поля.'; return; }
    if (pass.length < 4) { err.textContent = 'Пароль минимум 4 символа.'; return; }
    if (age < CONFIG.app.minAge) { err.textContent = `Регистрация с ${CONFIG.app.minAge} лет.`; return; }
    if (bio.length < CONFIG.app.minBio) { err.textContent = 'Расскажите о себе подробнее.'; return; }
    if (!country || !city) { err.textContent = 'Выберите страну и город.'; return; }

    const bioCheck = validateBio(bio);
    if (!bioCheck.ok) { err.textContent = bioCheck.reason; return; }

    const existing = await DB.findUserByName(name);
    if (existing) { err.textContent = 'Такое имя уже занято.'; return; }

    state.testDraft = { name, age, pass, bio, interests, country, city, photos: [...state.regPhotos] };
    state.test = createAdaptiveSession(CONFIG.app.testQuestions);
    state.view = 'test';
    track('register_start');
    render();
  };
}

/* ============ TEST ============ */
function renderTest() {
  const s = state.test;
  const q = s.current;
  const progress = (s.currentIndex / s.total) * 100;
  return `
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="progress"><div class="progress-bar" style="width:${progress}%"></div></div>
        <h1 style="font-size:22px;">Проверка мышления</h1>
        <p class="sub" style="margin-bottom:16px;">Вопрос ${s.currentIndex + 1} из ${s.total}. Верных: ${s.score}</p>
        <div class="question">
          <span class="diff-badge diff-${q.difficulty}">${DIFF_LABEL[q.difficulty]}</span>
          <p class="q-text">${esc(q.q)}</p>
          ${q.opts.map((opt, i) => `
            <label class="opt" data-i="${i}">
              <input type="radio" name="answer" value="${i}">${esc(opt)}
            </label>`).join('')}
        </div>
        <div class="error" id="test-error"></div>
        <button type="button" class="btn" id="answer-btn">Ответить</button>
      </div>
    </div>`;
}
function bindTest() {
  $$('.opt').forEach(l => l.onclick = () => {
    $$('.opt').forEach(x => x.classList.remove('selected'));
    l.classList.add('selected');
  });
  $('#answer-btn').onclick = async () => {
    const sel = document.querySelector('input[name="answer"]:checked');
    const err = $('#test-error');
    if (!sel) { err.textContent = 'Выберите вариант.'; return; }
    const res = state.test.answer(parseInt(sel.value));
    if (res.done) await finishTest();
    else render();
  };
}
async function finishTest() {
  const s = state.test;
  const d = state.testDraft;
  if (s.percent < CONFIG.app.passThreshold) {
    $('#root').innerHTML = `
      <div class="auth-wrap">
        <div class="auth-card" style="text-align:center;">
          <h1 style="font-size:22px;">Недостаточно</h1>
          <p class="sub">Правильных ответов: ${s.score} из ${s.total}</p>
          <p style="color:var(--muted);margin-bottom:24px;line-height:1.6;">Cortex — не для всех. Попробуйте позже.</p>
          <button type="button" class="btn ghost" onclick="location.reload()">Вернуться</button>
        </div>
      </div>`;
    track('register_fail', { score: s.score });
    return;
  }
  try {
    const userId = await DB.createUser({
      name: d.name, age: d.age, bio: d.bio, interests: d.interests,
      photos: d.photos, country: d.country, city: d.city,
      password: d.pass, score: s.score, scoreTotal: s.total
    });
    if (DB.mode === 'local') await DB.setSession(userId);
    state.userId = userId;
    state.view = 'app';
    state.page = 'discover';
    state.test = null;
    state.regPhotos = [];
    showToast(`Добро пожаловать, ${d.name}`);
    track('register_success', { score: s.score });
    await render();
  } catch (e) {
    $('#root').innerHTML = `
      <div class="auth-wrap">
        <div class="auth-card" style="text-align:center;">
          <h1 style="font-size:22px;">Ошибка регистрации</h1>
          <p class="sub">${esc(e.message)}</p>
          <button type="button" class="btn ghost" onclick="location.reload()">Назад</button>
        </div>
      </div>`;
  }
}

/* ============ APP ============ */
async function renderApp(user) {
  const matches = await DB.getMutualMatches(user.id);
  let content = '';
  switch (state.page) {
    case 'discover':     content = await renderDiscover(user); break;
    case 'view-profile': content = await renderProfileView(user); break;
    case 'matches':      content = await renderMatches(user, matches); break;
    case 'chats':        content = await renderChats(user, matches); break;
    case 'chat':         content = await renderChat(user); break;
    case 'profile':      content = await renderProfile(user, matches); break;
    case 'verify':       content = renderVerifyPage(); break;
    default:             content = await renderDiscover(user);
  }
  return `
    <div class="app-shell">
      <aside class="sidebar">
        <div class="logo">Cortex</div>
        <button type="button" class="nav-btn ${state.page === 'discover' ? 'active' : ''}" data-page="discover">${ic.search(18)}<span class="label">Поиск</span></button>
        <button type="button" class="nav-btn ${state.page === 'matches' ? 'active' : ''}" data-page="matches">${ic.heart(18)}<span class="label">Матчи</span>${matches.length ? `<span class="badge">${matches.length}</span>` : ''}</button>
        <button type="button" class="nav-btn ${state.page === 'chats' ? 'active' : ''}" data-page="chats">${ic.chat(18)}<span class="label">Чаты</span></button>
        <button type="button" class="nav-btn ${state.page === 'profile' ? 'active' : ''}" data-page="profile">${ic.user(18)}<span class="label">Профиль</span></button>
        <div class="sidebar-footer">
          <div style="margin-bottom:8px;">${esc(user.name)}, ${user.age}</div>
          <button type="button" class="btn ghost small" id="logout-btn" style="width:100%;">Выйти</button>
        </div>
      </aside>
      <main class="main">${content}</main>
    </div>`;
}

function bindApp(user) {
  $$('[data-page]').forEach(b => b.onclick = async () => {
    state.page = b.dataset.page;
    state.currentProfileId = null;
    state.activeChat = null;
    await render();
  });

  const logout = $('#logout-btn');
  if (logout) logout.onclick = async () => {
    await DB.clearSession();
    state.userId = null;
    state.view = 'auth';
    render();
  };

  $$('[data-view-profile]').forEach(el => el.onclick = async () => {
    state.previousPage = state.page;
    state.currentProfileId = el.dataset.viewProfile;
    state.page = 'view-profile';
    await render();
  });
  $$('[data-open-chat]').forEach(el => el.onclick = async () => {
    state.activeChat = el.dataset.openChat;
    state.page = 'chat';
    await render();
  });

  const backBtn = $('#back-btn');
  if (backBtn) backBtn.onclick = async () => {
    state.page = state.previousPage === 'view-profile' ? 'discover' : (state.previousPage || 'discover');
    await render();
  };

  const likeBtn = $('#like-btn');
  if (likeBtn) likeBtn.onclick = async () => {
    const targetId = state.currentProfileId;
    if (!targetId) return;
    if (await DB.isBlocked(user.id, targetId)) { showToast('Пользователь заблокирован'); return; }
    const isMatch = await DB.likeUser(user.id, targetId);
    track('like', { match: isMatch });
    if (isMatch) {
      showToast('Взаимная симпатия');
      state.activeChat = targetId;
      state.page = 'chat';
    } else {
      showToast('Лайк отправлен');
      state.page = 'discover';
    }
    state.currentProfileId = null;
    await render();
  };
  const passBtn = $('#pass-btn');
  if (passBtn) passBtn.onclick = async () => {
    await DB.passUser(user.id, state.currentProfileId);
    state.page = 'discover';
    state.currentProfileId = null;
    await render();
  };

  const blockBtn = $('#block-btn');
  if (blockBtn) blockBtn.onclick = () => triggerBlock(user, state.currentProfileId);

  const reportBtn = $('#report-btn');
  if (reportBtn) reportBtn.onclick = () => triggerReport(user, state.currentProfileId);

  // Chat
  const chatBack = $('#chat-back');
  if (chatBack) chatBack.onclick = async () => {
    state.page = 'chats';
    state.activeChat = null;
    await render();
  };

  const callBtn = $('#call-btn');
  if (callBtn) callBtn.onclick = async () => {
    const targetId = state.activeChat;
    if (!targetId) return;
    if (await DB.isBlocked(user.id, targetId)) { showToast('Пользователь заблокирован'); return; }
    const target = await DB.getUser(targetId);
    if (target) { track('call_start'); openCallModal(user.id, target.id, target.name); }
  };

  const menuBtn = $('#menu-btn');
  if (menuBtn) menuBtn.onclick = (e) => {
    e.stopPropagation();
    const existing = document.querySelector('.menu');
    if (existing) { existing.remove(); return; }
    const menu = document.createElement('div');
    menu.className = 'menu';
    menu.innerHTML = `
      <button type="button" data-menu="block">${ic.lock(14)} Заблокировать</button>
      <button type="button" data-menu="report">${ic.flag(14)} Пожаловаться</button>`;
    menuBtn.parentElement.appendChild(menu);
    menu.querySelector('[data-menu="block"]').onclick = () => { menu.remove(); triggerBlock(user, state.activeChat); };
    menu.querySelector('[data-menu="report"]').onclick = () => { menu.remove(); triggerReport(user, state.activeChat); };
    setTimeout(() => {
      document.addEventListener('click', function off() {
        menu.remove();
        document.removeEventListener('click', off);
      }, { once: true });
    }, 0);
  };

  const micBtn = $('#mic-btn');
  if (micBtn) micBtn.onclick = () => toggleRecording(user.id);

  const chatForm = $('#chat-form');
  if (chatForm) {
    chatForm.onsubmit = async (e) => {
      e.preventDefault();
      const input = $('#chat-input');
      const text = input.value.trim();
      if (!text) return;
      const check = validateMessage(text);
      if (!check.ok) { showToast(check.reason); return; }
      if (await DB.isBlocked(user.id, state.activeChat)) { showToast('Пользователь заблокирован'); return; }
      try {
        await DB.sendMessage(user.id, state.activeChat, text);
        input.value = '';
        await refreshMessages(user.id);
      } catch (err) { showToast(err.message); }
    };
  }

  const verifyBtn = $('#verify-btn');
  if (verifyBtn) verifyBtn.onclick = async () => {
    state.previousPage = state.page;
    state.page = 'verify';
    await render();
  };
  const verifyForm = $('#verify-form');
  if (verifyForm) verifyForm.onsubmit = async (e) => {
    e.preventDefault();
    const file = $('#v-file').files[0];
    const uni = $('#v-uni').value.trim();
    const year = $('#v-year').value.trim();
    if (!file || !uni) { showToast('Заполните поля'); return; }
    try {
      await submitVerification(user.id, file, uni, year);
      showToast('Заявка отправлена');
      state.page = 'profile';
      await render();
    } catch (err) { showToast(err.message); }
  };

  const pushBtn = $('#push-btn');
  if (pushBtn) pushBtn.onclick = async () => {
    const res = await requestPushPermission(user.id, DB.savePushToken);
    if (res.ok) showToast('Уведомления включены');
    else showToast('Не удалось включить: ' + (res.reason || 'неизвестно'));
  };

  $$('[data-unblock]').forEach(btn => btn.onclick = async (e) => {
    e.stopPropagation();
    await DB.unblockUser(user.id, btn.dataset.unblock);
    showToast('Разблокирован');
    await render();
  });

  bindVoicePlayers(document);
}

async function triggerBlock(user, targetId) {
  if (!targetId) return;
  const target = await DB.getUser(targetId);
  const ok = await openConfirmModal({
    title: 'Заблокировать пользователя?',
    text: `${target?.name || 'Пользователь'} исчезнет из поиска и чатов. Переписка станет недоступна, а лайки будут удалены.`,
    confirmLabel: 'Заблокировать',
    danger: true
  });
  if (!ok) return;
  await DB.blockUser(user.id, targetId);
  track('block');
  showToast('Пользователь заблокирован');
  state.currentProfileId = null;
  state.activeChat = null;
  state.page = 'discover';
  await render();
}

async function triggerReport(user, targetId) {
  if (!targetId) return;
  const target = await DB.getUser(targetId);
  const reason = await openReportModal(target?.name || 'профиль');
  if (!reason) return;
  await DB.createReport({ fromUserId: user.id, targetUserId: targetId, reason });
  showToast('Жалоба отправлена');
  track('report');
}

async function refreshMessages(userId) {
  const msgs = await DB.getMessages(userId, state.activeChat);
  const box = $('#messages');
  if (!box) return;
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 160;
  box.innerHTML = msgsHTML(userId, msgs);
  if (nearBottom) box.scrollTop = box.scrollHeight;
  bindVoicePlayers(box);
}

async function toggleRecording(userId) {
  const btn = $('#mic-btn');
  if (!btn) return;
  if (state.recorder) {
    const rec = await state.recorder.stop();
    state.recorder = null;
    btn.classList.remove('recording');
    btn.removeAttribute('data-timer');
    if (rec && rec.duration > 0.5) {
      try {
        await DB.sendMessage(userId, state.activeChat, rec);
        await refreshMessages(userId);
      } catch (err) { showToast(err.message); }
    }
    return;
  }
  try {
    state.recorder = new VoiceRecorder();
    state.recorder.onTick = (sec) => { btn.dataset.timer = fmtDuration(sec); };
    await state.recorder.start();
    btn.classList.add('recording');
    btn.dataset.timer = '0:00';
  } catch (e) {
    showToast('Микрофон недоступен');
    state.recorder = null;
  }
}

/* ============ PAGES ============ */
async function renderDiscover(user) {
  const all = await DB.listUsers();
  const matches = await DB.getMutualMatches(user.id);
  const candidates = [];
  for (const u of all) {
    if (u.id === user.id) continue;
    if (matches.includes(u.id)) continue;
    if (await DB.isBlocked(user.id, u.id)) continue;
    if (await DB.isPassed(user.id, u.id)) continue;
    candidates.push({ u, score: compatibility(user, u) });
  }
  candidates.sort((a, b) => b.score - a.score);

  if (!candidates.length) {
    return `
      <h1 class="page-title">Поиск</h1>
      <p class="page-sub">Пока нет новых профилей</p>
      <div class="empty">
        <h3>Пока тихо</h3>
        <p>${DB.mode === 'local'
          ? 'Откройте сайт во второй вкладке и зарегистрируйте второго пользователя.'
          : 'Пригласите друзей — как только кто-то зарегистрируется, он появится здесь.'}</p>
        ${DB.mode === 'local' ? '<button type="button" class="btn ghost small" onclick="window.open(location.href, \'_blank\')">Открыть новую вкладку</button>' : ''}
      </div>`;
  }
  return `
    <h1 class="page-title">Поиск</h1>
    <p class="page-sub">Профили, отсортированные по интеллектуальной совместимости</p>
    <div class="list">
      ${candidates.map(({ u, score }) => `
        <div class="list-item" data-view-profile="${u.id}" role="button" tabindex="0">
          ${avatarHTML(u, 'sm')}
          <div class="info">
            <h4>${esc(u.name)}, ${u.age}${u.verified ? verifiedBadgeSVG() : ''}</h4>
            <p>${esc((u.bio || '').slice(0, 90))}${u.bio?.length > 90 ? '…' : ''}</p>
            ${u.country ? `<div class="loc">${esc(locationLabel(u))}</div>` : ''}
          </div>
          <div class="score-badge">${score}%</div>
        </div>`).join('')}
    </div>`;
}

async function renderProfileView(user) {
  const t = await DB.getUser(state.currentProfileId);
  if (!t) { state.page = 'discover'; return ''; }
  if (await DB.isBlocked(user.id, t.id)) {
    state.page = 'discover';
    return `<div class="empty"><h3>Профиль недоступен</h3><p>Пользователь заблокирован.</p></div>`;
  }
  const score = compatibility(user, t);
  return `
    <button type="button" class="btn ghost small" id="back-btn" style="margin-bottom:22px;">${ic.arrowL(16)} Назад</button>
    <div class="profile-card">
      ${avatarHTML(t)}
      <h2>${esc(t.name)}, ${t.age}${t.verified ? verifiedBadgeSVG() : ''}</h2>
      ${t.country ? `<div class="meta">${esc(locationLabel(t))}</div>` : ''}
      <div class="match-score">${score}% совместимости</div>
      ${galleryHTML(t.photos)}
      <p class="bio">${esc(t.bio)}</p>
      <div class="tags">${(t.interests || []).map(x => `<span class="tag">${esc(x)}</span>`).join('')}</div>
      <div class="actions">
        <button type="button" class="btn pass" id="pass-btn">Пропустить</button>
        <button type="button" class="btn like" id="like-btn">${ic.heart(16)} Нравится</button>
      </div>
      <div class="actions">
        <button type="button" class="btn ghost small" id="block-btn">${ic.lock(14)} Заблокировать</button>
        <button type="button" class="btn ghost small" id="report-btn">${ic.flag(14)} Жалоба</button>
      </div>
    </div>`;
}

async function renderMatches(user, matches) {
  const visible = [];
  for (const id of matches) {
    if (await DB.isBlocked(user.id, id)) continue;
    const u = await DB.getUser(id);
    if (!u) continue;
    visible.push({ u, score: compatibility(user, u) });
  }
  if (!visible.length) {
    return `
      <h1 class="page-title">Матчи</h1>
      <p class="page-sub">Взаимные симпатии</p>
      <div class="empty">
        <h3>Пока никого</h3>
        <p>Поставьте лайк в разделе «Поиск». Если симпатия взаимна — появится матч.</p>
      </div>`;
  }
  return `
    <h1 class="page-title">Матчи</h1>
    <p class="page-sub">Взаимные симпатии</p>
    <div class="list">
      ${visible.map(({ u, score }) => `
        <div class="list-item" data-open-chat="${u.id}" role="button" tabindex="0">
          ${avatarHTML(u, 'sm')}
          <div class="info">
            <h4>${esc(u.name)}, ${u.age}${u.verified ? verifiedBadgeSVG() : ''}</h4>
            <p>${esc((u.bio || '').slice(0, 80))}…</p>
          </div>
          <div class="score-badge">${score}%</div>
        </div>`).join('')}
    </div>`;
}

async function renderChats(user, matches) {
  const rows = [];
  for (const id of matches) {
    if (await DB.isBlocked(user.id, id)) continue;
    const u = await DB.getUser(id);
    if (!u) continue;
    const msgs = await DB.getMessages(user.id, id);
    const last = msgs[msgs.length - 1];
    let preview = 'Нет сообщений. Начните разговор.';
    if (last) {
      const prefix = last.from === user.id ? 'Вы: ' : '';
      preview = last.type === 'voice' ? prefix + 'Голосовое сообщение' : prefix + last.text;
    }
    rows.push({ u, preview });
  }
  if (!rows.length) {
    return `
      <h1 class="page-title">Чаты</h1>
      <p class="page-sub">Общение доступно после взаимного матча</p>
      <div class="empty">
        <h3>Нет активных чатов</h3>
        <p>Сначала найдите совпадения в разделе «Поиск».</p>
      </div>`;
  }
  return `
    <h1 class="page-title">Чаты</h1>
    <p class="page-sub">Переписка с вашими матчами</p>
    <div class="list">
      ${rows.map(({ u, preview }) => `
        <div class="list-item" data-open-chat="${u.id}" role="button" tabindex="0">
          ${avatarHTML(u, 'sm')}
          <div class="info">
            <h4>${esc(u.name)}</h4>
            <p>${esc(preview.slice(0, 70))}</p>
          </div>
        </div>`).join('')}
    </div>`;
}

async function renderChat(user) {
  const t = await DB.getUser(state.activeChat);
  if (!t) { state.page = 'chats'; return ''; }
  if (await DB.isBlocked(user.id, t.id)) {
    return `
      <h1 class="page-title">Чат недоступен</h1>
      <p class="page-sub">Пользователь заблокирован</p>
      <div class="empty">
        <h3>Переписка закрыта</h3>
        <p>Разблокировать пользователя можно на странице профиля.</p>
        <button type="button" class="btn ghost small" id="chat-back">К чатам</button>
      </div>`;
  }
  const msgs = await DB.getMessages(user.id, t.id);
  return `
    <div class="chat-wrap">
      <div class="chat-header">
        <button type="button" class="back" id="chat-back" aria-label="Назад">${ic.arrowL(20)}</button>
        ${avatarHTML(t, 'sm')}
        <h3>${esc(t.name)}, ${t.age}${t.verified ? verifiedBadgeSVG() : ''}</h3>
        <div class="chat-actions">
          <button type="button" class="icon-btn" id="call-btn" title="Видеозвонок" aria-label="Видеозвонок">${ic.video(18)}</button>
          <button type="button" class="icon-btn" id="menu-btn" title="Действия" aria-label="Действия">${ic.more(18)}</button>
        </div>
      </div>
      <div class="messages" id="messages">${msgsHTML(user.id, msgs)}</div>
      <form class="chat-input" id="chat-form" autocomplete="off">
        <button type="button" class="icon-btn" id="mic-btn" title="Голосовое сообщение" aria-label="Голосовое">${ic.mic(18)}</button>
        <input id="chat-input" placeholder="Напишите сообщение" autocomplete="off">
        <button type="submit" class="btn send" aria-label="Отправить">${ic.arrowR(18)}</button>
      </form>
    </div>`;
}

function msgsHTML(userId, msgs) {
  if (!msgs.length) return `<div class="chat-empty">Начните разговор</div>`;
  return msgs.map((m, i) => {
    const cls = m.from === userId ? 'me' : 'them';
    const id = `vm_${m.ts || Date.now()}_${i}`;
    const body = m.type === 'voice'
      ? voicePlayerHTML(id, m.dataUrl, m.duration || 0)
      : esc(m.text || '');
    return `<div class="msg ${cls}">${body}<span class="time">${fmtTime(m.ts || Date.now())}</span></div>`;
  }).join('');
}

async function renderProfile(user, matches) {
  const pct = user.scoreTotal ? Math.round(user.score / user.scoreTotal * 100) : 0;
  const blockedIds = await DB.listBlocked(user.id);
  const blockedUsers = [];
  for (const id of blockedIds) {
    const u = await DB.getUser(id);
    if (u) blockedUsers.push(u);
  }
  return `
    <h1 class="page-title">Профиль</h1>
    <p class="page-sub">Ваши данные и статистика</p>
    <div class="profile-card">
      ${avatarHTML(user)}
      <h2>${esc(user.name)}, ${user.age}${user.verified ? verifiedBadgeSVG() : ''}</h2>
      ${user.country ? `<div class="meta">${esc(locationLabel(user))}</div>` : ''}
      <div class="match-score">Тест: ${user.score}/${user.scoreTotal} (${pct}%)</div>
      ${galleryHTML(user.photos)}
      <p class="bio">${esc(user.bio)}</p>
      <div class="tags">${(user.interests || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
      <div class="stats">
        <div>Матчей: <b>${matches.length}</b></div>
        <div>Заблокировано: <b>${blockedUsers.length}</b></div>
        <div>Backend: <b>${DB.mode}</b></div>
        <div>Верификация: <b>${user.verified ? 'Пройдена' : 'Не пройдена'}</b></div>
      </div>
      <div class="actions">
        ${!user.verified && CONFIG.features.verification
          ? `<button type="button" class="btn ghost" id="verify-btn">${ic.badge(16)} Подтвердить диплом</button>` : ''}
        ${CONFIG.features.notifications
          ? `<button type="button" class="btn ghost" id="push-btn">${ic.bell(16)} Уведомления</button>` : ''}
      </div>
      ${blockedUsers.length ? `
        <div class="blocked-list">
          <h3>Заблокированные</h3>
          <div class="list">
            ${blockedUsers.map(u => `
              <div class="list-item">
                ${avatarHTML(u, 'sm')}
                <div class="info">
                  <h4>${esc(u.name)}</h4>
                  <p>${esc((u.bio || '').slice(0, 60))}…</p>
                </div>
                <button type="button" class="unblock-btn" data-unblock="${u.id}">Разблокировать</button>
              </div>`).join('')}
          </div>
        </div>` : ''}
    </div>`;
}

function renderVerifyPage() {
  return `
    <button type="button" class="btn ghost small" id="back-btn" style="margin-bottom:22px;">${ic.arrowL(16)} Назад</button>
    <h1 class="page-title">Верификация диплома</h1>
    <p class="page-sub">Загрузите фото диплома. Заявка будет проверена модератором.</p>
    <form id="verify-form" style="max-width:520px;" autocomplete="off">
      <label>ВУЗ</label>
      <input id="v-uni" placeholder="МГУ им. Ломоносова" required>
      <label>Год выпуска</label>
      <input id="v-year" type="number" min="1950" max="2100" placeholder="2020">
      <label>Фото диплома</label>
      <input id="v-file" type="file" accept="image/*" required>
      <button type="submit" class="btn">Отправить на проверку</button>
    </form>`;
}

/* ============ BOOTSTRAP ============ */
(async () => {
  // Manifest через Blob URL (без отдельного .json)
  try {
    const ICON_SVG = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%2307080c'/%3E%3Ctext x='256' y='330' text-anchor='middle' font-family='Georgia,serif' font-size='300' font-weight='bold' fill='%238ba3ff'%3EC%3C/text%3E%3C/svg%3E";
    const manifest = {
      name: 'Cortex — знакомства для умных',
      short_name: 'Cortex',
      description: 'Пространство для глубоких разговоров',
      start_url: './', scope: './',
      display: 'standalone', orientation: 'portrait',
      background_color: '#07080c', theme_color: '#07080c', lang: 'ru',
      icons: [{ src: ICON_SVG, sizes: 'any', type: 'image/svg+xml', purpose: 'any' }]
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
  } catch (e) { console.warn('[Cortex] Manifest:', e); }

  await initDB();
  initAnalytics();
  await initNotifications();

  let queued = false;
  DB.onDataChange(() => {
    if (queued) return;
    queued = true;
    requestAnimationFrame(async () => {
      queued = false;
      if (state.view !== 'app') return;
      if (state.page === 'chat' && state.activeChat) {
        const user = await DB.getUser(state.userId);
        if (!user) return;
        const msgs = await DB.getMessages(user.id, state.activeChat);
        const box = document.getElementById('messages');
        if (box) {
          const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 160;
          if (nearBottom) {
            box.innerHTML = msgsHTML(user.id, msgs);
            box.scrollTop = box.scrollHeight;
            bindVoicePlayers(box);
          }
        }
        return;
      }
      if (document.activeElement?.matches('input,textarea,select')) return;
      await render();
    });
  });

  await render();
  track('pageview');

  document.addEventListener('gesturestart', e => e.preventDefault());
})();
</script>
